<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物记忆 · 名册</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f5f4f7; --panel:#fefdff; --line:rgba(55,50,70,.16);
    --text:#211f28; --muted:#6d6879; --accent:#5b4b7a; --accent2:#b8862f;
    --chip:rgba(91,75,122,.10); --shadow:0 8px 28px rgba(33,31,40,.10); --danger:#b3402f;
  }
  html[data-theme="dark"] {
    --bg:#17161c; --panel:#201e27; --line:rgba(255,255,255,.14);
    --text:#e7e3ef; --muted:#a29cae; --accent:#b3a2d6; --accent2:#d8a94a;
    --chip:rgba(179,162,214,.14); --shadow:0 8px 28px rgba(0,0,0,.35); --danger:#e07a68;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg:#17161c; --panel:#201e27; --line:rgba(255,255,255,.14);
      --text:#e7e3ef; --muted:#a29cae; --accent:#b3a2d6; --accent2:#d8a94a;
      --chip:rgba(179,162,214,.14); --shadow:0 8px 28px rgba(0,0,0,.35); --danger:#e07a68;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 22px 40px; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:19px; margin:0; } .sub { color:var(--muted); font-size:12px; margin:3px 0 0; }
  .toolbar { display:flex; gap:10px; align-items:center; margin:16px 0 12px; flex-wrap:wrap; }
  input[type="search"], input[type="number"], input[type="text"] {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:8px 11px; font:inherit; outline:none; }
  #search { flex:1 1 240px; } input:focus { border-color:var(--accent); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:8px 13px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  .list { display:grid; gap:8px; }
  .row { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 15px; box-shadow:var(--shadow); display:flex; gap:12px;
    align-items:center; justify-content:space-between; cursor:pointer; }
  .row:hover { border-color:var(--accent); }
  .who { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .name { font-weight:600; } .qq { color:var(--muted); font-size:12px; }
  .profile { color:var(--muted); font-size:12.5px; margin-top:4px; max-width:560px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:11px; padding:2px 9px; border-radius:999px; background:var(--chip); color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:36px 0; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--panel);
    color:var(--text); padding:0; width:min(860px,95vw); box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg-head { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); gap:10px; }
  .dlg-head h2 { font-size:16px; margin:0; }
  .dlg-body { padding:14px 18px; max-height:66vh; overflow:auto; }
  .section-title { font-size:12px; color:var(--muted); margin:16px 0 8px; letter-spacing:.4px; }
  .profile-box { background:var(--chip); border-radius:10px; padding:10px 12px; font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.topic { white-space:nowrap; font-weight:600; }
  td.time { white-space:nowrap; color:var(--muted); font-size:12px; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--chip); color:var(--muted); }
  .mini { padding:3px 8px; font-size:12px; }
  details { margin-top:14px; }
  summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .raw { font-size:12px; color:var(--muted); margin-top:8px; }
  .raw div { padding:3px 0; border-bottom:1px dashed var(--line); }
  .settings { margin-top:18px; }
  .settings .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:10px; }
  .field { display:grid; gap:5px; } .field label { font-size:12px; color:var(--muted); }
  .check { display:flex; align-items:center; gap:8px; font-size:13px; }
  .hint { color:var(--muted); font-size:12px; }
  #toast { position:fixed; right:20px; bottom:20px; padding:9px 14px; border-radius:10px;
    background:var(--accent); color:#fff; font-size:13px; opacity:0; transition:opacity .18s; pointer-events:none; }
  #toast.show { opacity:1; } #toast.error { background:var(--danger); }
</style>
</head>
<body>
  <h1>人物记忆</h1>
  <p class="sub" id="sub">读取中…</p>

  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索称呼 / 别名 / QQ">
    <button id="refresh">刷新</button>
    <button id="extractAll" class="primary">整理全部</button>
  </div>

  <div class="list" id="list"></div>

  <details class="settings" id="settingsBox">
    <summary>整理设置</summary>
    <div class="grid">
      <label class="check"><input type="checkbox" id="sEnabled"> 启用后台整理</label>
      <div class="field"><label for="sInterval">间隔（秒）</label><input id="sInterval" type="number" min="30" step="30"></div>
      <div class="field"><label for="sMin">每次最少消息</label><input id="sMin" type="number" min="1" step="1"></div>
      <div class="field"><label for="sMax">每次最多消息</label><input id="sMax" type="number" min="5" step="5"></div>
      <div class="field"><label for="sProvider">提取模型 Provider ID</label><input id="sProvider" type="text" placeholder="zgate-router"></div>
      <div class="field"><label for="sInject">注入要点条数</label><input id="sInject" type="number" min="1" step="1"></div>
      <div class="field"><label for="sRaw">整理后保留原文条数</label><input id="sRaw" type="number" min="0" step="1"></div>
      <div class="field"><label for="sFactMax">要点上限</label><input id="sFactMax" type="number" min="10" step="10"></div>
    </div>
    <div class="toolbar"><button id="saveSettings" class="primary">保存设置</button><span class="hint" id="settingsStatus"></span></div>
  </details>

  <dialog id="detail">
    <div class="dlg-head">
      <h2 id="detailTitle">—</h2>
      <div class="chips">
        <button type="button" class="mini" id="extractOne">整理这个人</button>
        <button type="button" class="mini" id="closeDetail">关闭</button>
      </div>
    </div>
    <div class="dlg-body">
      <div class="section-title">画像</div>
      <div class="profile-box" id="detailProfile">（还没有整理过）</div>

      <div class="section-title">要点表格</div>
      <table>
        <thead><tr><th>时间</th><th>话题</th><th>摘要</th><th>标签</th><th></th></tr></thead>
        <tbody id="factBody"></tbody>
      </table>

      <details>
        <summary>原始消息（整理后会自动裁剪）</summary>
        <div class="raw" id="rawBody"></div>
      </details>
    </div>
    <div class="dlg-foot" style="display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)">
      <span class="hint" id="detailHint"></span>
      <button type="button" class="danger" id="forgetBtn">忘记这个人</button>
    </div>
  </dialog>

  <div id="toast"></div>
<script type="module">
const bridge = window.AstrBotPluginPage || null;
let people = [];
let current = null;
let toastTimer = 0;

function toast(msg, err) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.toggle("error", !!err); el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function unwrap(res) {
  if (res && typeof res === "object" && "ok" in res) {
    if (!res.ok) throw new Error(res.message || "请求失败");
    return res.data !== undefined ? res.data : res;
  }
  return res;
}
async function apiGet(path, params) {
  if (!bridge || !bridge.apiGet) throw new Error("页面桥接不可用，请从 AstrBot WebUI 打开");
  return unwrap(await bridge.apiGet(path, params || {}));
}
async function apiPost(path, body) {
  if (!bridge || !bridge.apiPost) throw new Error("页面桥接不可用，请从 AstrBot WebUI 打开");
  return unwrap(await bridge.apiPost(path, body || {}));
}
function esc(text) {
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtTime(ts, withTime) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, "0");
  const date = pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  return withTime ? date + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) : date;
}
function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const items = people.filter(p => !query ||
    String(p.name || "").toLowerCase().includes(query) ||
    String(p.qq).includes(query) ||
    (p.aliases || []).some(a => String(a).toLowerCase().includes(query)) ||
    String(p.profile || "").toLowerCase().includes(query));
  document.getElementById("sub").textContent = "共 " + people.length + " 人" +
    (query ? "，匹配 " + items.length + " 人" : "");
  const list = document.getElementById("list");
  if (!items.length) { list.innerHTML = '<div class="empty">还没有记住任何人</div>'; return; }
  list.innerHTML = items.map(p =>
    '<div class="row" data-qq="' + esc(p.qq) + '">' +
      '<div><div class="who"><span class="name">' + esc(p.name || "未命名") + '</span>' +
      '<span class="qq">' + esc(p.qq) + '</span></div>' +
      (p.profile ? '<div class="profile">' + esc(p.profile) + '</div>' : '') +
      '<div class="chips"><span class="chip">' + esc(p.stage) + ' · ' + p.intimacy + ' 点</span>' +
      '<span class="chip">要点 ' + (p.facts || 0) + ' 条</span>' +
      '<span class="chip">互动 ' + p.count + ' 次</span></div></div>' +
      '<span class="hint">' + fmtTime(p.last_seen) + '</span>' +
    '</div>').join("");
}
async function load() {
  try {
    const data = await apiGet("people");
    people = data.people || [];
    render();
  } catch (err) {
    document.getElementById("sub").textContent = "读取失败：" + (err.message || err);
    toast(err.message || "读取失败", true);
  }
}
function renderFacts(person) {
  const facts = (person.facts || []).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  document.getElementById("factBody").innerHTML = facts.length
    ? facts.map(f =>
        '<tr><td class="time">' + fmtTime(f.ts) + '</td>' +
        '<td class="topic">' + esc(f.topic) + '</td>' +
        '<td>' + esc(f.summary) + '</td>' +
        '<td><div class="tags">' + (f.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div></td>' +
        '<td><button type="button" class="mini danger" data-fact="' + esc(f.id) + '">删</button></td></tr>'
      ).join("")
    : '<tr><td colspan="5" class="hint">还没有整理出要点，点右上角「整理这个人」。</td></tr>';
  const raw = (person.messages || []).slice().reverse();
  document.getElementById("rawBody").innerHTML = raw.length
    ? raw.map(m => '<div>' + fmtTime(m.ts, true) + ' · ' + esc(m.text) + '</div>').join("")
    : '<div>（无）</div>';
}
async function openDetail(qq) {
  try {
    const person = await apiGet("person", { qq });
    current = person;
    document.getElementById("detailTitle").textContent =
      (person.preferred_name || person.last_card || person.last_nickname || "未命名") + " · " + qq;
    document.getElementById("detailProfile").textContent =
      (person.profile && person.profile.summary) || "（还没有整理过）";
    renderFacts(person);
    document.getElementById("detailHint").textContent =
      "互动 " + (person.count || 0) + " 次 · 别名 " +
      ((person.aliases || []).join("、") || "无");
    document.getElementById("detail").showModal();
  } catch (err) { toast(err.message || "读取失败", true); }
}
async function extractOne() {
  if (!current) return;
  try {
    const res = await apiPost("extract", { qq: current.qq });
    if (!res.done) { toast("没有新消息可整理"); return; }
    toast("整理完成");
    await openDetail(current.qq);
    await load();
  } catch (err) { toast(err.message || "整理失败", true); }
}
async function extractAll() {
  try {
    const res = await apiPost("extract", {});
    toast("已整理 " + (res.done || 0) + " 人");
    await load();
  } catch (err) { toast(err.message || "整理失败", true); }
}
async function deleteFact(factId) {
  if (!current) return;
  try {
    const person = await apiPost("fact/delete", { qq: current.qq, id: factId });
    current = person;
    document.getElementById("detailProfile").textContent =
      (person.profile && person.profile.summary) || "（还没有整理过）";
    renderFacts(person);
    await load();
    toast("已删除");
  } catch (err) { toast(err.message || "删除失败", true); }
}
async function forgetCurrent() {
  if (!current) return;
  if (!confirm("忘记 " + (current.preferred_name || current.qq) + " 的画像、要点和历史？")) return;
  try {
    await apiPost("forget", { qq: current.qq });
    document.getElementById("detail").close();
    current = null;
    await load();
    toast("已忘记");
  } catch (err) { toast(err.message || "操作失败", true); }
}
async function loadSettings() {
  try {
    const d = await apiGet("config");
    document.getElementById("sEnabled").checked = !!d.extract_enabled;
    document.getElementById("sInterval").value = Math.round(d.extract_interval_sec || 180);
    document.getElementById("sMin").value = d.extract_min_messages || 4;
    document.getElementById("sMax").value = d.extract_max_messages || 30;
    document.getElementById("sProvider").value = d.extract_provider_id || "";
    document.getElementById("sInject").value = d.fact_inject || 5;
    document.getElementById("sRaw").value = d.raw_keep_after_extract || 0;
    document.getElementById("sFactMax").value = d.fact_max || 50;
  } catch (err) { toast(err.message || "读取设置失败", true); }
}
async function saveSettings() {
  try {
    await apiPost("config", {
      extract_enabled: document.getElementById("sEnabled").checked,
      extract_interval_sec: Number(document.getElementById("sInterval").value || 180),
      extract_min_messages: Number(document.getElementById("sMin").value || 4),
      extract_max_messages: Number(document.getElementById("sMax").value || 30),
      extract_provider_id: document.getElementById("sProvider").value.trim(),
      fact_inject: Number(document.getElementById("sInject").value || 5),
      raw_keep_after_extract: Number(document.getElementById("sRaw").value || 0),
      fact_max: Number(document.getElementById("sFactMax").value || 50),
    });
    document.getElementById("settingsStatus").textContent = "已保存并生效";
    toast("设置已保存");
  } catch (err) { toast(err.message || "保存失败", true); }
}
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("extractAll").addEventListener("click", extractAll);
document.getElementById("extractOne").addEventListener("click", extractOne);
document.getElementById("closeDetail").addEventListener("click", () => document.getElementById("detail").close());
document.getElementById("forgetBtn").addEventListener("click", forgetCurrent);
document.getElementById("saveSettings").addEventListener("click", saveSettings);
document.getElementById("factBody").addEventListener("click", event => {
  const btn = event.target.closest("[data-fact]");
  if (btn) deleteFact(btn.dataset.fact);
});
document.getElementById("list").addEventListener("click", event => {
  const row = event.target.closest("[data-qq]");
  if (row) openDetail(row.dataset.qq);
});
const themeParam = new URLSearchParams(location.search).get("theme");
if (themeParam === "dark" || themeParam === "light") document.documentElement.dataset.theme = themeParam;
load();
loadSettings();
</script>
</body>
</html>
